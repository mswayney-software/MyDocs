name: Deploy to GitHub Pages

# Publishes the app after CI passes on main, so a failing build never goes live.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pages serves MyDocs from /<repository name>/ and MySlides from /<repository name>/slides/.
      # Each has its own service worker; MyDocs' leaves the slides/ folder alone (vite.config.ts).
      - run: npm run build -w mydocs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run build -w myslides
        env:
          BASE_PATH: /${{ github.event.repository.name }}/slides/
      - run: cp -r apps/slides/dist apps/docs/dist/slides
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
